name: Main baseline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source without stored credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # official v4
        with:
          persist-credentials: false
      - name: Generate map constants for production C fixtures
        run: |
          make -C tools/mapjson
          tools/mapjson/mapjson groups emerald data/maps/map_groups.json data/maps include/constants
          tools/mapjson/mapjson layouts emerald data/layouts/layouts.json data/layouts include/constants
      - name: Protocol and actual-source C regressions (no native game sessions)
        run: PYTHONPATH=.:test/world python3 -m unittest test_coop_catching test_tag_coop test_link_protocol test_link_sessions test_trainer_abort_wire_regression test_link_battle_payloads test_coop_controller_repro test_native_save_commit test_native_save_component test_native_save_io test_trade_save_commit test_coop_faint_friendship test_coop_completion_echo test_coop_completion_peers test_link_trade_payloads test_trade_storage_access test_coop_engine test_dedicated test_shared_world_client test_hosting test_hosting_session test_coop_private_return test_crossed_tag_activity test_crossed_tag_transport test_launcher_instance test_hosting_backup test_linux_package test_native_generated_map test_generated_map_import test_generated_map_save_guard test_shared_generated_cave test_world_cave_wire test_native_cave_flow test_cave_hello test_cave_activity_guard test_cave_presence_guard test_cave_exit_warp test_cave_collision test_shared_cave_socket test_publish_shared_cave test_story_rally -v

  linux-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout source without stored credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # official v4
        with:
          persist-credentials: false
      - name: Install Linux build prerequisites on the ephemeral runner
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential libpng-dev libsdl2-dev
      - name: Restore hash-pinned upstream build inputs (never uploaded)
        run: python3 scripts/restore_upstream_assets.py
      - name: Compile Linux with warnings as errors
        run: make -j2 linux CFLAGS=-g WERROR=1
      - name: Standalone headless frame and save smoke (not multiplayer acceptance)
        run: python3 test/headless/smoke.py ./pokeemerald64 --out build/main-smoke
      # Deliberately no binary/ROM/save artifact uploads. Standalone smoke does
      # not establish human multiplayer or internet acceptance.
