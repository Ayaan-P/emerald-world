name: Guilds
on:
  pull_request:
    paths:
      - 'world/guilds.py'
      - 'world/guild_chat.py'
      - 'world/server.py'
      - 'src/platform/world_chat.c'
      - 'test/test_guilds.py'
      - 'test/test_guild_chat_gate.py'
      - '.github/workflows/test-guilds.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guilds:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test guild membership and private chat without sockets
        run: python3 -m unittest discover -s test -p 'test_guild*.py' -v
