name: Windows native client verification

on:
  workflow_dispatch:
  pull_request:
    branches: [vanilla]

permissions:
  contents: read

# Run the private project's review build or an explicit manual verification.
concurrency:
  group: windows-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-client:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - name: Checkout source without stored credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # official v4
        with:
          persist-credentials: false
      - name: Native Windows Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # official v5
        with:
          python-version: '3.11'
      - name: Signed MSYS2 packages on ephemeral runner
        id: msys2
        timeout-minutes: 10
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # official v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-openssl
      - name: Restore hash-pinned upstream build inputs locally
        shell: pwsh
        timeout-minutes: 3
        run: python scripts/restore_upstream_assets.py
      - name: Compile real native Windows PE with MinGW GCC
        shell: msys2 {0}
        timeout-minutes: 25
        run: make -j2 winwsl PREFIX= CC=gcc CXX=g++ SDL_DIR=/mingw64 OS=Windows_NT WERROR=1
      - name: Set native runtime dependency path
        shell: pwsh
        run: |
          $mingw = Join-Path '${{ steps.msys2.outputs.msys2-location }}' 'mingw64/bin'
          if (!(Test-Path $mingw)) { throw 'MSYS2 MinGW runtime directory missing' }
          $mingw | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "EW_MINGW_BIN=$mingw" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Test launcher gateway and packaging boundaries
        shell: pwsh
        timeout-minutes: 6
        run: python scripts/windows_verify.py --label unit --timeout 240 --report build/verification/unit.json -- python -m unittest test.world.test_windows_client test.world.test_windows_package -v
      - name: Verify real Windows frames and GBA-layout saves against baseline
        shell: pwsh
        timeout-minutes: 16
        run: python scripts/windows_verify.py --label smoke --timeout 840 --report build/verification/smoke.json -- python test/headless/smoke.py ./pokeemerald64.exe --out build/windows-smoke
      - name: Native loopback fixture and realtime SDL cadence
        shell: pwsh
        timeout-minutes: 3
        run: python scripts/windows_verify.py --label bridge --timeout 120 --report build/verification/bridge.json -- python scripts/windows_bridge_test.py --binary ./pokeemerald64.exe --save build/windows-smoke/first_battle/game.sav --report build/verification/native-fixture.json
      - name: Source launcher Tk self-test
        shell: pwsh
        timeout-minutes: 2
        run: python scripts/windows_verify.py --label source-self-test --timeout 60 --report build/verification/source-self-test.json -- python -m world.windows_client --self-test
      - name: Install pinned official PyPI packager
        shell: pwsh
        timeout-minutes: 5
        run: python -m pip install --disable-pip-version-check --index-url https://pypi.org/simple pyinstaller==6.22.3
      - name: Freeze remote-only player launcher
        shell: pwsh
        timeout-minutes: 7
        run: python scripts/windows_verify.py --label freeze --timeout 360 --report build/verification/freeze.json -- python -m PyInstaller --noconfirm --clean --onedir --windowed --name EmeraldWorld --paths . --distpath build/windows-dist --workpath build/windows-pyinstaller --specpath build/windows-pyinstaller scripts/windows_entry.py
      - name: Prepare local-only portable folder, recursive DLL closure and ZIP
        shell: pwsh
        timeout-minutes: 5
        run: |
          python scripts/windows_verify.py --label package --timeout 240 --report build/verification/package.json -- python scripts/windows_package.py --launcher build/windows-dist/EmeraldWorld --binary pokeemerald64.exe --dll-dir "$env:EW_MINGW_BIN" --objdump "$env:EW_MINGW_BIN/objdump.exe" --output build/windows-package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item build/windows-package/checksums.json build/verification/checksums.json
      - name: Exercise frozen launcher and packaged PE without build-tool PATH
        shell: pwsh
        timeout-minutes: 4
        run: |
          $python = (Get-Command python).Source
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          & $python scripts/windows_verify.py --label frozen-self-test --timeout 60 --report build/verification/frozen-self-test.json -- build/windows-package/EmeraldWorld/EmeraldWorld.exe --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python scripts/windows_verify.py --label bridge --timeout 120 --report build/verification/portable-bridge.json -- $python scripts/windows_bridge_test.py --binary build/windows-package/EmeraldWorld/game/pokeemerald64.exe --save build/windows-smoke/first_battle/game.sav --report build/verification/portable-native-fixture.json
          exit $LASTEXITCODE
      # Do not add binary, ZIP, ROM, save, test directory or raw log uploads.
      - name: Upload text verification only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # official v4
        with:
          name: windows-native-verification
          retention-days: 7
          if-no-files-found: warn
          path: |
            build/verification/unit.json
            build/verification/smoke.json
            build/verification/bridge.json
            build/verification/native-fixture.json
            build/verification/source-self-test.json
            build/verification/freeze.json
            build/verification/package.json
            build/verification/frozen-self-test.json
            build/verification/portable-bridge.json
            build/verification/portable-native-fixture.json
            build/verification/checksums.json
