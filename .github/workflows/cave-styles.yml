name: Generated cave styles

on:
  pull_request:
    branches: [dot/shared-generated-cave]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cave-styles-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  geometry-and-author:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source without stored credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # official v4
        with:
          persist-credentials: false
      - name: Generate map catalog constants
        run: |
          make -C tools/mapjson
          tools/mapjson/mapjson groups emerald data/maps/map_groups.json data/maps include/constants
          tools/mapjson/mapjson layouts emerald data/layouts/layouts.json data/layouts include/constants
      - name: Validate authored layouts through Python and native staging
        run: PYTHONPATH=.:test/world python3 -m unittest test_cave_blueprint test_author_cave test_generated_map_import test_shared_generated_cave test_cave_hello test_world_cave_wire test_generated_cave_persistence -v
