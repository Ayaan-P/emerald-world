name: Experimental smooth world presence

on:
  pull_request:
    branches: [main, dot/matched-trainer-appearances]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smooth-presence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  component-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source without stored credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # official v4
        with:
          persist-credentials: false
      - name: Generate map constants for production C fixtures
        run: |
          make -C tools/mapjson
          tools/mapjson/mapjson groups emerald data/maps/map_groups.json data/maps include/constants
          tools/mapjson/mapjson layouts emerald data/layouts/layouts.json data/layouts include/constants
      - name: Exercise production smooth presence, trainer matching and capacity components
        run: PYTHONPATH=.:test/world python3 -m unittest test_smooth_presence test_matched_trainers test_presence_reconcile test_native_tilebank test_native_oam_capacity test_world_sprite_capacity test_extended_peer_window test_world_entity_capacity test_save_isolation -v
  linux-smooth-presence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout source without stored credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # official v4
        with:
          persist-credentials: false
      - name: Install Linux build prerequisites on the ephemeral runner
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential libpng-dev libsdl2-dev
      - name: Restore hash-pinned upstream build inputs (never uploaded)
        run: python3 scripts/restore_upstream_assets.py
      - name: Compile all experimental capacity gates
        run: make -j2 linux CFLAGS=-g WERROR=1 WORLD_EXTENDED_OBJECTS=1 WORLD_EXTENDED_SPRITES=1 WORLD_NATIVE_OAM=1 WORLD_NATIVE_TILEBANK=1 WORLD_MATCHED_TRAINERS=1 WORLD_SMOOTH_PRESENCE=1
      - name: Check smooth-presence build flag
        run: grep -R -- '-DWORLD_SMOOTH_PRESENCE=1' build/*/build_flags.txt
      - name: Standalone headless frame and save smoke without golden changes
        run: python3 test/headless/smoke.py ./pokeemerald64 --out build/smooth-presence-smoke
      # No ROM, binary, save or runtime-data artifacts are uploaded.
