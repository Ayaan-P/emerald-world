name: Build whole-source Expansion candidate
on:
  pull_request:
    paths:
      - 'port/**'
      - 'scripts/apply_bulk_expansion_port.py'
      - 'test/test_apply_bulk_expansion_port.py'
      - 'test/test_initial_resolutions.py'
      - 'test/test_movement_capacity.py'
      - 'test/test_link_engine_gate.py'
      - 'world/server.py'
      - '.github/workflows/build-bulk-expansion.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Test port preparation
        run: |
          python3 -m unittest discover -s test -p test_apply_bulk_expansion_port.py -v
          python3 -m unittest discover -s test -p test_initial_resolutions.py -v
          python3 -m unittest discover -s test -p test_movement_capacity.py -v
          python3 -m unittest discover -s test -p test_link_engine_gate.py -v
      - name: Apply candidate to clean pinned donor
        run: python3 scripts/apply_bulk_expansion_port.py engines/expansion-native
      - name: Install native build prerequisites
        timeout-minutes: 30
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y build-essential gcc-multilib python3 pkg-config libpng-dev libsdl2-dev gdb
      - name: Compile whole-source candidate
        working-directory: engines/expansion-native
        shell: bash
        run: |
          set -o pipefail
          make -f "$GITHUB_WORKSPACE/port/expansion-world.mk" -k -j2 native BITS=64 2>&1 | tee "$RUNNER_TEMP/bulk-build.log"
      - name: Replay offline opening and save round trip
        working-directory: engines/expansion-native
        timeout-minutes: 10
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: tests/smoke/run.sh build/native64/pokeemerald-native "$RUNNER_TEMP/bulk-smoke"
      - name: Diagnose failed offline replay
        if: failure()
        working-directory: engines/expansion-native
        timeout-minutes: 5
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          if [ -x build/native64/pokeemerald-native ]; then
            mkdir -p "$RUNNER_TEMP/bulk-debug"
            gdb -batch -ex run -ex 'x/12i $pc-16' -ex 'info registers' -ex 'thread apply all bt full' --args \
              build/native64/pokeemerald-native --headless --silent --unthrottled \
              --replay tests/smoke/opening.replay --out "$RUNNER_TEMP/bulk-debug" \
              --save "$RUNNER_TEMP/bulk-debug/player.sav" \
              --rtc-offset "$RUNNER_TEMP/bulk-debug/player.rtc" --rtc-fixed 1700000000 \
              2>&1 | tee "$RUNNER_TEMP/bulk-gdb.log"
          fi
      - name: Preserve failed replay and trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bulk-expansion-smoke-debug
          path: |
            ${{ runner.temp }}/bulk-smoke/work/*.log
            ${{ runner.temp }}/bulk-smoke/work/*.txt
            ${{ runner.temp }}/bulk-gdb.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve candidate build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bulk-expansion-build-log
          path: ${{ runner.temp }}/bulk-build.log
          if-no-files-found: ignore
          retention-days: 7
