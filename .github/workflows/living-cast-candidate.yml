name: Living cast candidate components
on:
  pull_request:
    branches: [main, dot/concurrent-actor-activities, dot/shared-safari-outings, dot/private-mystery-partners, dot/authored-world-stories, dot/team-field-games, dot/actor-agreements, dot/conditional-actor-plans, dot/campaign-rendezvous, dot/object-action-choices, dot/adaptive-navigation, dot/procedural-regions, dot/persistent-population, dot/actor-local-attention, dot/vision-coop-player, dot/actor-history-search, dot/npc-guided-journeys, dot/battle-spectating, dot/shared-fishing-grounds, dot/shared-battle-runs, dot/cast-campaign-formats, dot/authored-region-networks, dot/cast-world-racing, dot/cast-world-television, dot/cast-world-cooperation, dot/campaign-npc-experiences, dot/companion-move-learning, dot/rc12-core-story, dot/rc12-living-cast, dot/actor-capability-runtime, dot/actor-object-runtime, dot/actor-space-authoring, dot/actor-place-authoring, dot/actor-habitat-authoring, dot/actor-population, dot/actor-author-loop, dot/player-object-use, dot/actor-landscapes, dot/world-goal-author, dot/population-agents, dot/persistent-agent-cadence, dot/agent-trainer-lineups, dot/agent-practice-capability, dot/practice-session, dot/actor-event-waits, dot/actor-object-programs, dot/npc-public-conversation]
    paths:
      - 'world/**'
      - 'test/world/**'
      - 'scripts/check_living_cast.py'
      - 'scripts/build_expansion.py'
      - 'engines/living-cast-candidate.json'
      - '.github/workflows/living-cast-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authority-components:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install required mechanic isolation dependency
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap
      - name: Generate map constants for production C fixtures
        run: |
          make -C tools/mapjson
          tools/mapjson/mapjson groups emerald data/maps/map_groups.json data/maps include/constants
          tools/mapjson/mapjson layouts emerald data/layouts/layouts.json data/layouts include/constants
      - name: Authority, author contracts and setup components without credentials
        run: python3 scripts/check_living_cast.py
      # Native source-only fixtures may skip here. Linked-native and live-model
      # acceptance belong to the separate integration checkout, not this job.

  ordinary-player-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test bounded player policies and private Unix controller transport
        env:
          PYTHONPATH: .:test/world
        run: python3 -m unittest test_player_api_policy test_player_runtime -v
