name: Experimental generated cave autotiling

on:
  pull_request:
    branches: [dot/generated-cave-native-playthrough]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cave-autotile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source without stored credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # official v4
        with:
          persist-credentials: false
      - name: Generate map constants for fixtures
        run: |
          make -C tools/mapjson
          tools/mapjson/mapjson groups emerald data/maps/map_groups.json data/maps include/constants
          tools/mapjson/mapjson layouts emerald data/layouts/layouts.json data/layouts include/constants
      - name: Exercise native tile selection and authored geometry
        run: PYTHONPATH=.:test/world:test/headless python3 -m unittest test_cave_build_flags test_cave_playthrough_harness test_cave_autotile test_cave_blueprint test_author_cave test_generated_map_import test_native_generated_map test_shared_generated_cave test_world_cave_wire -v
  linux-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout source without stored credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # official v4
        with:
          persist-credentials: false
      - name: Install Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential libpng-dev libsdl2-dev
      - name: Restore hash-pinned upstream build inputs (never uploaded)
        run: python3 scripts/restore_upstream_assets.py
      - name: Compile native generated cave and autotiling
        run: make -j2 linux CFLAGS=-g GENERATED_MAP_READY=1 GENERATED_MAP_AUTOTILE=1 WERROR=1
      - name: Verify build gates
        run: |
          grep -R -- '-DGENERATED_MAP_READY=1' build/*/build_flags.txt
          grep -R -- '-DGENERATED_MAP_AUTOTILE=1' build/*/build_flags.txt
      - name: Standalone frame and save smoke without golden changes
        run: python3 test/headless/smoke.py ./pokeemerald64 --out build/cave-autotile-smoke
      - name: Play the generated cave offline with a disposable save
        run: |
          PYTHONPATH=.:test/headless timeout 180s python3 test/headless/generated_cave_playthrough.py \
            --binary ./pokeemerald64 --seed-save build/cave-autotile-smoke/first_battle/game.sav \
            --out build/cave-playthrough
      - name: Trigger a real generated-cave wild encounter offline
        run: |
          PYTHONPATH=.:test/headless timeout 180s python3 test/headless/generated_cave_playthrough.py \
            --binary ./pokeemerald64 --seed-save build/cave-autotile-smoke/first_battle/game.sav \
            --out build/cave-encounter --encounter
      # No binary, ROM, save or runtime-data artifacts are uploaded.
