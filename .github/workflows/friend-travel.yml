name: Friend travel

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/platform/world_travel.c'
      - 'src/platform/world_bridge.c'
      - 'src/field_effect.c'
      - 'src/start_menu.c'
      - 'test/world/test_world_travel.py'
      - 'test/world/test_travel_roster.py'
      - 'test/world/test_presence_handshake.py'
      - 'world/server.py'
      - '.github/workflows/friend-travel.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  travel-components:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source without stored credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Generate native map and heal-location constants
        run: |
          make -C tools/mapjson
          make -C tools/jsonproc
          make generated -j2
      - name: Run travel, co-op, interaction and private-save tests
        run: PYTHONPATH=.:test/world python3 -m unittest test.world.test_world_travel test.world.test_travel_roster test.world.test_presence_handshake test.world.test_world_activity test.world.test_interactions test.world.test_save_isolation -v

  native-refusal-acceptance:
    # Full native flows run once on the frozen integrated RC. Keep this
    # optional runner path explicit; never weaken the engine sandbox for CI.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout source without stored credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install isolated native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential libpng-dev libsdl2-dev bubblewrap
      - name: Restore pinned upstream build inputs
        run: python3 scripts/restore_upstream_assets.py
      - name: Build native game
        run: make -j2 linux CFLAGS=-g WERROR=1
      - name: Generate disposable early-game save
        run: python3 test/headless/smoke.py ./pokeemerald64 --out build/travel-seed
      - name: Exercise two native clients, refusal and safe cancellation
        run: python3 test/world/native_travel_acceptance.py --binary ./pokeemerald64 --seed-save build/travel-seed/first_battle/game.sav
      # This early-game fixture does not exercise earned Fly or publish artifacts.
