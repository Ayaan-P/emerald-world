name: Friend travel

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/platform/world_travel.c'
      - 'src/platform/world_bridge.c'
      - 'src/field_effect.c'
      - 'src/start_menu.c'
      - 'test/world/test_world_travel.py'
      - '.github/workflows/friend-travel.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  travel-components:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source without stored credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Generate native map and heal-location constants
        run: |
          make -C tools/mapjson
          make -C tools/jsonproc
          make generated -j2
      - name: Run travel, co-op, interaction and private-save tests
        run: PYTHONPATH=.:test/world python3 -m unittest test.world.test_world_travel test.world.test_world_activity test.world.test_interactions test.world.test_save_isolation -v
